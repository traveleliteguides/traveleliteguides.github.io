<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destinations | Travel Elite Guides</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #000;
            --text-color: #fff;
            --gray-text: #bbb;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            text-align: center;
        }

        nav {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--gold);
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        nav a:hover { color: var(--gold); }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
        }

        /* NOVA KARTICA SA SLIKOM U POZADINI */
        .destination-card {
            position: relative;
            height: 450px;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            align-items: flex-end; /* Tekst ide na dno */
            transition: 0.4s;
            background-size: cover;
            background-position: center;
            text-decoration: none;
        }

        /* Ovdje ubacujemo sliku Mallorce */
        .mallorca {
            background-image: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0.2)), 
                              url('https://images.unsplash.com/photo-1512753360435-301583e40266?q=80&w=2070&auto=format&fit=crop');
        }

        .destination-card:hover {
            transform: scale(1.02);
            border-color: var(--gold);
        }

        .content {
            padding: 30px;
            text-align: left;
            width: 100%;
        }

        .content h3 {
            color: var(--gold);
            margin: 0;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .content p {
            color: #fff;
            font-size: 1rem;
            margin: 10px 0 20px 0;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }

        .dest-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .dest-links a {
            background: var(--gold);
            color: #000;
            padding: 8px 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.75rem;
            border-radius: 5px;
            text-transform: uppercase;
        }

        footer {
            margin-top: 50px;
            padding: 30px;
            font-size: 0.8rem;
            border-top: 1px solid #222;
            color: var(--gray-text);
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="destinations.html" style="color: var(--gold);">Destinations</a>
        <a href="hotels.html">Hotels</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="sightseeing.html">Sightseeing</a>
        <a href="transport.html">Transport</a>
    </nav>

    <h1 style="margin-top: 50px; text-transform: uppercase; letter-spacing: 3px; color: var(--gold);">Explore Destinations</h1>

    <div class="container">
        
        <div class="destination-card mallorca">
            <div class="content">
                <h3>Mallorca, Spain</h3>
                <p>Turquoise waters and hidden coves await you.</p>
                <div class="dest-links">
                    <a href="hotels.html">Hotels</a>
                    <a href="restaurants.html">Food</a>
                    <a href="sightseeing.html">Sights</a>
                    <a href="transport.html">Travel</a>
                </div>
            </div>
        </div>

        </div>

    <footer>
        <p>&copy; 2026 Travel Elite Guides</p>
    </footer>

</body>
</html>
